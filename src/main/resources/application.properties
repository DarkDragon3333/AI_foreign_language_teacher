spring.application.name=AI_foreign_language_teacher
server.port=8080

# --- Postgres (в docker compose значения приходят из переменных окружения) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/tutor
spring.datasource.username=tutor
spring.datasource.password=tutor
spring.datasource.hikari.maximum-pool-size=5
# schema.sql идемпотентен (CREATE TABLE IF NOT EXISTS), выполняется на каждом старте
spring.sql.init.mode=always

# --- LLM ---
tutor.ollama.base-url=http://localhost:11434
tutor.ollama.model=qwen3:4b-instruct-2507-q4_K_M
tutor.ollama.num-ctx=4096
tutor.ollama.num-predict=500
tutor.ollama.request-timeout=180s
tutor.ollama.queue-timeout=60s
tutor.ollama.keep-alive=30m

# --- LanguageTool (проверяемый слой грамматики, CPU) ---
tutor.languagetool.base-url=http://localhost:8010
tutor.languagetool.language=en-US
tutor.languagetool.enabled=true
tutor.languagetool.timeout=8s

# --- Урок ---
tutor.lesson.default-cefr=B1
tutor.lesson.native-lang=ru
tutor.lesson.target-lang=en
# сколько последних реплик уходит в промпт (полная история остаётся в БД)
tutor.lesson.history-messages=10

# Для локального запуска без nginx: Spring сам раздаёт папку web/
spring.web.resources.static-locations=file:./web/,classpath:/static/
