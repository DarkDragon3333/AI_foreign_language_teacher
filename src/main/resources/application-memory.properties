# Профиль "memory": запуск без Postgres, данные живут в памяти процесса.
# Нужен для разработки и тестов:  --spring.profiles.active=memory
spring.sql.init.mode=never
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
# без отдельного сервиса эмбеддингов карточки находятся по id LanguageTool и по словам
tutor.embed.enabled=false
