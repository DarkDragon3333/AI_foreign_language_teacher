services:
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TUTOR_OLLAMA_BASE_URL: http://ollama:11434
      TUTOR_LANGUAGETOOL_BASE_URL: http://languagetool:8010
      TUTOR_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      TUTOR_LESSON_DEFAULT_CEFR: ${DEFAULT_CEFR:-B1}
    networks:
      - tutor-net
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      languagetool:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB"]
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - tutor-net
    healthcheck:
      # $$ — чтобы переменные подставил контейнер, а не compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_NUM_PARALLEL: "1"
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - tutor-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Проверка грамматики на CPU, без n-gram (правило архитектуры: ~1 ГБ RAM)
  languagetool:
    image: erikvl87/languagetool
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g
    networks:
      - tutor-net
    restart: unless-stopped

  # Одноразовый контейнер: скачивает модель в volume при первом запуске и завершается.
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"]
    networks:
      - tutor-net
    depends_on:
      - ollama
    restart: on-failure

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      - tutor-net
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:

networks:
  tutor-net:
