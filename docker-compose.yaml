services:
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TUTOR_OLLAMA_BASE_URL: http://ollama:11434
      TUTOR_LANGUAGETOOL_BASE_URL: http://languagetool:8010
      TUTOR_EMBED_BASE_URL: http://embed:9003
      TUTOR_STT_BASE_URL: http://stt:9001
      TUTOR_TTS_BASE_URL: http://tts:9002
      TUTOR_OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b-it-qat}
      TUTOR_LESSON_DEFAULT_CEFR: ${DEFAULT_CEFR:-B1}
    networks:
      - tutor-net
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      languagetool:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB"]
    volumes:
      - pgdata:/var/lib/postgresql
    # IDE на хосте ходит в localhost:5432; сам сайт по-прежнему только через nginx на порту 80
    ports:
      - "5432:5432"
    networks:
      - tutor-net
    healthcheck:
      # $$ — чтобы переменные подставил контейнер, а не compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # в видеопамяти одна модель: иначе урок не влезет в 6 ГБ
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - tutor-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Поиск карточек по смыслу. Модель маленькая и сидит на процессоре: видеопамять остаётся у Ollama.
  embed:
    build: ./embed
    environment:
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - embed_models:/models
    networks:
      - tutor-net
    restart: unless-stopped

  # Распознавание речи на CPU. Видеопамять остаётся у модели урока.
  stt:
    build: ./stt
    environment:
      WHISPER_MODEL: small
      COMPUTE_TYPE: int8
      DEVICE: cpu
      WHISPER_DOWNLOAD_ROOT: /models
      STT_LANGUAGE: en
    volumes:
      - whisper_models:/models
    networks:
      - tutor-net
    restart: unless-stopped

  # Озвучка на CPU. Видеопамять остаётся у модели урока.
  tts:
    build: ./tts
    environment:
      KOKORO_DIR: /models
      KOKORO_VOICE: af_heart
    volumes:
      - kokoro_voices:/models
    networks:
      - tutor-net
    restart: unless-stopped

  # Проверка грамматики на CPU, без n-gram (правило архитектуры: ~1 ГБ RAM)
  languagetool:
    image: erikvl87/languagetool
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g
    networks:
      - tutor-net
    restart: unless-stopped

  # Одноразовый контейнер: скачивает модель в volume при первом запуске и завершается.
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-gemma4:e4b-it-qat}"]
    networks:
      - tutor-net
    depends_on:
      - ollama
    restart: on-failure

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      - tutor-net
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
  embed_models:
  whisper_models:
  kokoro_voices:

networks:
  tutor-net:
