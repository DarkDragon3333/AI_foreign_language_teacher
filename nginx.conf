server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker: nginx заново находит контейнер app после его пересборки (иначе 502 до перезапуска nginx)
    resolver 127.0.0.11 valid=10s;

    location / {
        # браузер каждый раз проверяет, не изменились ли страница, стили и скрипты
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE-стрим ответа учителя: без буферизации и с долгим таймаутом
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
